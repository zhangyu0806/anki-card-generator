<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki学习卡片生成器 - PDF转Anki</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .upload-area {
            border: 3px dashed #e0e0e0;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        
        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .upload-text {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            font-size: 0.9rem;
            color: #999;
        }
        
        #fileInput {
            display: none;
        }
        
        .file-info {
            display: none;
            background: #f0f7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .file-info.show {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .file-name {
            font-weight: 500;
            color: #333;
        }
        
        .file-remove {
            color: #f56565;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .option-group {
            display: flex;
            flex-direction: column;
        }
        
        .option-label {
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }
        
        .option-input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .option-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .checkbox-label:hover {
            border-color: #667eea;
        }
        
        .checkbox-label input {
            margin-right: 8px;
        }
        
        .checkbox-label.checked {
            background: #f0f7ff;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress {
            display: none;
            margin-top: 20px;
        }
        
        .progress.show {
            display: block;
        }
        
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
            animation: progress 2s ease-in-out infinite;
        }
        
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 90%; }
        }
        
        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 8px;
            border: 2px solid #86efac;
        }
        
        .result.show {
            display: block;
        }
        
        .result-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #166534;
            margin-bottom: 15px;
        }
        
        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #166534;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #166534;
            opacity: 0.8;
        }
        
        .download-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .download-btn {
            padding: 12px 24px;
            background: #166534;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        
        .download-btn:hover {
            background: #14532d;
            transform: translateY(-2px);
        }
        
        .preview {
            margin-top: 20px;
        }
        
        .preview-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .preview-cards {
            display: grid;
            gap: 10px;
        }
        
        .preview-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
        }
        
        .preview-card-front {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }
        
        .preview-card-back {
            color: #666;
            font-size: 0.9rem;
        }
        
        .preview-card-type {
            display: inline-block;
            padding: 2px 8px;
            background: #e0e7ff;
            color: #4338ca;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 5px;
        }
        
        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fef2f2;
            border-radius: 8px;
            border: 2px solid #fca5a5;
            color: #991b1b;
        }
        
        .error.show {
            display: block;
        }
        
        .features {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .feature {
            text-align: center;
            color: white;
            opacity: 0.9;
        }
        
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .feature-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .feature-desc {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Anki学习卡片生成器</h1>
            <p>上传PDF，自动生成Anki学习卡片</p>
        </div>
        
        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <div class="upload-text">点击或拖拽上传PDF文件</div>
                <div class="upload-hint">支持最大50MB的PDF文件</div>
                <input type="file" id="fileInput" accept=".pdf">
            </div>
            
            <div class="file-info" id="fileInfo">
                <span class="file-name" id="fileName"></span>
                <span class="file-remove" id="fileRemove">移除</span>
            </div>
            
            <div class="options">
                <div class="option-group">
                    <label class="option-label">牌组名称</label>
                    <input type="text" class="option-input" id="deckName" placeholder="学习卡片" value="学习卡片">
                </div>
                
                <div class="option-group">
                    <label class="option-label">输出格式</label>
                    <select class="option-input" id="outputFormat">
                        <option value="apkg">Anki格式 (.apkg)</option>
                        <option value="quizlet">Quizlet CSV</option>
                        <option value="flashcards">Flashcards JSON</option>
                        <option value="all">全部格式</option>
                    </select>
                </div>
                
                <div class="option-group">
                    <label class="option-label">卡片类型</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label checked">
                            <input type="checkbox" value="qa" checked> 问答卡
                        </label>
                        <label class="checkbox-label checked">
                            <input type="checkbox" value="cloze" checked> 填空卡
                        </label>
                        <label class="checkbox-label checked">
                            <input type="checkbox" value="concept" checked> 概念卡
                        </label>
                    </div>
                </div>
                
                <div class="option-group">
                    <label class="option-label">卡片数量限制</label>
                    <input type="number" class="option-input" id="cardLimit" placeholder="不限制" min="1">
                </div>
            </div>
            
            <button class="btn btn-primary" id="generateBtn" disabled>
                🚀 生成学习卡片
            </button>
            
            <div class="progress" id="progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">正在解析PDF...</div>
            </div>
            
            <div class="error" id="error"></div>
            
            <div class="result" id="result">
                <div class="result-title">✅ 生成成功！</div>
                <div class="result-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="statPages">0</div>
                        <div class="stat-label">页数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statKeypoints">0</div>
                        <div class="stat-label">知识点</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statCards">0</div>
                        <div class="stat-label">生成卡片</div>
                    </div>
                </div>
                <div class="download-buttons" id="downloadButtons"></div>
                <div class="preview" id="preview"></div>
            </div>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">快速生成</div>
                <div class="feature-desc">500页PDF只需几分钟</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🎯</div>
                <div class="feature-title">智能提取</div>
                <div class="feature-desc">自动识别重点内容</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-title">多平台支持</div>
                <div class="feature-desc">Anki/Quizlet/Flashcards</div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileRemove = document.getElementById('fileRemove');
        const generateBtn = document.getElementById('generateBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const error = document.getElementById('error');
        const result = document.getElementById('result');
        
        let selectedFile = null;
        
        // 上传区域点击
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectFile(e.target.files[0]);
            }
        });
        
        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectFile(e.dataTransfer.files[0]);
            }
        });
        
        // 选择文件
        function selectFile(file) {
            if (!file.name.endsWith('.pdf')) {
                showError('请选择PDF文件');
                return;
            }
            selectedFile = file;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            generateBtn.disabled = false;
        }
        
        // 移除文件
        fileRemove.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedFile = null;
            fileInput.value = '';
            fileInfo.classList.remove('show');
            generateBtn.disabled = true;
        });
        
        // 复选框样式
        document.querySelectorAll('.checkbox-label').forEach(label => {
            label.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') {
                    const checkbox = label.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                }
                label.classList.toggle('checked', label.querySelector('input').checked);
            });
        });
        
        // 生成按钮
        generateBtn.addEventListener('click', generateCards);
        
        async function generateCards() {
            if (!selectedFile) return;
            
            // 重置状态
            error.classList.remove('show');
            result.classList.remove('show');
            progress.classList.add('show');
            generateBtn.disabled = true;
            
            // 更新进度
            const progressSteps = [
                '正在上传PDF...',
                '正在解析PDF...',
                '正在提取知识点...',
                '正在生成卡片...',
                '正在导出文件...'
            ];
            let stepIndex = 0;
            const progressInterval = setInterval(() => {
                if (stepIndex < progressSteps.length) {
                    progressText.textContent = progressSteps[stepIndex];
                    progressFill.style.width = `${(stepIndex + 1) * 20}%`;
                    stepIndex++;
                }
            }, 500);
            
            // 获取卡片类型
            const cardTypes = Array.from(document.querySelectorAll('.checkbox-group input:checked'))
                .map(cb => cb.value)
                .join(',');
            
            // 准备表单数据
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('deck_name', document.getElementById('deckName').value || '学习卡片');
            formData.append('card_types', cardTypes);
            formData.append('format', document.getElementById('outputFormat').value);
            formData.append('card_limit', document.getElementById('cardLimit').value);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                clearInterval(progressInterval);
                progressFill.style.width = '100%';
                progressText.textContent = '处理完成！';
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || '处理失败');
                }
                
                const data = await response.json();
                showResult(data);
                
            } catch (err) {
                clearInterval(progressInterval);
                progress.classList.remove('show');
                showError(err.message);
                generateBtn.disabled = false;
            }
        }
        
        function showResult(data) {
            progress.classList.remove('show');
            
            // 更新统计
            document.getElementById('statPages').textContent = data.stats.total_pages;
            document.getElementById('statKeypoints').textContent = data.stats.key_points;
            document.getElementById('statCards').textContent = data.stats.cards_generated;
            
            // 生成下载按钮
            const downloadButtons = document.getElementById('downloadButtons');
            downloadButtons.innerHTML = '';
            for (const [format, filename] of Object.entries(data.files)) {
                const btn = document.createElement('a');
                btn.className = 'download-btn';
                btn.href = data.download_urls[format];
                btn.download = filename;
                btn.textContent = `下载 ${format.toUpperCase()} 文件`;
                downloadButtons.appendChild(btn);
            }
            
            // 显示预览
            if (data.preview && data.preview.length > 0) {
                const preview = document.getElementById('preview');
                preview.innerHTML = '<div class="preview-title">📋 卡片预览（前5张）</div>';
                const previewCards = document.createElement('div');
                previewCards.className = 'preview-cards';
                
                data.preview.forEach(card => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'preview-card';
                    cardDiv.innerHTML = `
                        <span class="preview-card-type">${card.type.toUpperCase()}</span>
                        <div class="preview-card-front">${card.front}</div>
                        <div class="preview-card-back">${card.back}</div>
                    `;
                    previewCards.appendChild(cardDiv);
                });
                
                preview.appendChild(previewCards);
            }
            
            result.classList.add('show');
            generateBtn.disabled = false;
        }
        
        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
            setTimeout(() => error.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
